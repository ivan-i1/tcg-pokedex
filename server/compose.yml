# Runs on the home server from ~/services/tcg-pokedex (a clone of this repo):
#   cd ~/services/tcg-pokedex && git pull && docker compose -f server/compose.yml up -d --build
# Bound to 127.0.0.1 only: Caddy exposes it to the tailnet on :8443.
name: tcg-pokedex
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: tcg-pokedex-api:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18100:18100"
    mem_limit: 128m
